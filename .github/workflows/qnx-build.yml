# Guardian RT core — cross-build for QNX 8.0 (aarch64le + x86_64).
#
# Runs on a self-hosted runner (label `qnx800`) in a private QNX SDP 8.0 Docker image built on
# that machine (docker/qnx-sdp/). The SDP, the image and the licence stay on that machine:
# nothing QNX-proprietary is pulled, pushed, cached or uploaded except the binaries we build.
#
# Security (public repo): the job never runs for pull requests from forks, so untrusted code
# cannot execute on the self-hosted runner.
name: qnx-build

on:
  push:
    branches: [main]
    paths: ['guardian/**', 'docker/qnx-sdp/**', '.github/workflows/qnx-build.yml']
  pull_request:
    branches: [main]
    paths: ['guardian/**', 'docker/qnx-sdp/**', '.github/workflows/qnx-build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qnx-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, qnx800]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1   # one small build host
      matrix:
        include:
          - arch: aarch64le
            nm: ntoaarch64-nm
            elf: 'ARM aarch64'
          - arch: x86_64
            nm: ntox86_64-nm
            elf: 'x86-64'
    env:
      PRESET: qnx-${{ matrix.arch }}
      QNX_IMAGE: qnx-sdp:8.0
    steps:
      - uses: actions/checkout@v5

      # The QNX SDP lives in a private image built on this runner (docker/qnx-sdp/). It is
      # never pulled from or pushed to a registry; the licence is mounted from ~/.qnx.
      - name: QNX SDP image
        run: |
          docker image inspect "$QNX_IMAGE" >/dev/null 2>&1 \
            || { echo "::error::$QNX_IMAGE missing on this runner: run docker/qnx-sdp/build-image.sh"; exit 1; }
          docker/qnx-sdp/run.sh bash -c 'cmake --version | head -1; q++ -V 2>&1 | head -6 || true'

      - name: Configure
        run: docker/qnx-sdp/run.sh bash -c "cd guardian && cmake --preset $PRESET -G Ninja"

      - name: Build (-Werror)
        run: nice -n 10 docker/qnx-sdp/run.sh bash -c "cd guardian && cmake --build --preset $PRESET"

      - name: Verify QNX binary
        run: |
          docker/qnx-sdp/run.sh bash -c '
            set -euo pipefail
            bin="guardian/build/${{ env.PRESET }}/guardian"
            file "$bin" | tee /dev/stderr | grep -q "${{ matrix.elf }}"
            file "$bin" | grep -q ldqnx
            # The QNX loop (main_qnx.cpp) is in, not the POSIX fallback.
            for sym in MsgReceivePulse ChannelCreate timer_create timer_settime; do
              ${{ matrix.nm }} -D --undefined-only "$bin" | grep -qw "$sym" \
                || { echo "::error::$sym not referenced: wrong main?"; exit 1; }
            done
            echo "QNX APIs referenced: MsgReceivePulse ChannelCreate timer_create timer_settime"'

      - uses: actions/upload-artifact@v5
        with:
          name: guardian-qnx800-${{ matrix.arch }}
          path: guardian/build/${{ env.PRESET }}/guardian
          if-no-files-found: error
          retention-days: 14
